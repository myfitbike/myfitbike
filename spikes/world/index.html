<!doctype html>
<!-- Phase 0b/0c spike (throwaway): ride the baked world slice in three.js. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>VeloWorld world slice</title>
<style>
  html, body { margin:0; height:100%; overflow:hidden; background:#1e2633; font: 13px/1.35 -apple-system, system-ui, sans-serif; color:#fff }
  canvas { display:block }
  .pod { position:absolute; background:rgba(30,38,51,.55); backdrop-filter:blur(12px); border:1px solid rgba(255,255,255,.1); border-radius:12px; padding:10px 14px }
  #hud { left:24px; bottom:24px; display:flex; gap:22px; align-items:flex-end }
  #hud b { display:block; font: italic 700 44px/1 'Barlow Condensed', 'Avenir Next Condensed', sans-serif; font-variant-numeric: tabular-nums }
  #hud small { color:#a9b1be; font-size:11px; font-weight:600; letter-spacing:.12em }
  #perf { right:24px; top:24px; font: 12px/1.5 ui-monospace, Menlo, monospace; white-space:pre }
  #help { left:24px; top:24px; color:#a9b1be; max-width:380px }
  #prompt { left:50%; bottom:120px; transform:translateX(-50%); display:none }
  .amber { color:#f2c14e }
</style>
<script type="importmap">{ "imports": { "three": "./node_modules/three/build/three.module.js", "three/addons/": "./node_modules/three/examples/jsm/" } }</script>
</head>
<body>
<div id="help" class="pod"><b class="amber">World slice — Phase 0c look check</b><br>
↑/↓ power ±10 W (Shift ±50) · 1–4 camera (4 = side) · H hides HUD · the bike follows the road on its own</div>
<div id="hud" class="pod">
  <div><small>POWER</small><b id="hPower">200</b></div>
  <div><small>SPEED KM/H</small><b id="hSpeed">0.0</b></div>
  <div><small>GRADE %</small><b id="hGrade">0.0</b></div>
  <div><small>DISTANCE KM</small><b id="hDist">0.00</b></div>
  <div><small>ELEVATION M</small><b id="hElev">0</b></div>
</div>
<div id="perf" class="pod">loading…</div>
<script type="module" src="./main.js"></script>
</body>
</html>
