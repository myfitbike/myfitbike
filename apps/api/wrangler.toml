# Cloudflare Worker for the MyFitBike API (PLAN 17.3 / 17.5). Secrets are set with `wrangler secret put NAME`, never here:
# STRAVA_CLIENT_ID, STRAVA_CLIENT_SECRET, TOKEN_ENCRYPTION_KEY (and DATABASE_URL if not using Hyperdrive).
name = "myfitbike"  # one Worker: the website (static assets) and the API under /api
main = "src/worker.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]
# Keep the workers.dev address on: wrangler turns it off by default as soon as `routes` is set.
workers_dev = true
preview_urls = false   # no extra address per uploaded version: old versions must not stay callable (security audit 2, V7)
# Main address; www is served too and the web app moves it to myfitbike.com.
routes = [{ pattern = "myfitbike.com", custom_domain = true }, { pattern = "www.myfitbike.com", custom_domain = true }]

[vars]
FIREBASE_PROJECT_ID = "myfitbike-d5722"
WEB_BASE = "https://myfitbike.com"
PUBLIC_API_BASE = "https://myfitbike.com/api"   # where Strava redirects back to
ALLOWED_EMAILS = ""                         # optional invite list, comma-separated; empty = open sign-up; only verified e-mails get in

# The built website (pnpm --filter web build). Only /api/* reaches the Worker code; every other path is a file, or
# index.html for app routes like /rides/12 (single-page app).
[assets]
directory = "../web/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Rate limits (security audit M3), counted per Cloudflare location and approximate. Keys: the signed-in rider's id,
# or the caller's IP for the public health check. A ride posts samples every 30 s and a page load makes ~15 calls, so
# 600/min leaves a wide margin; "costly" calls spend Strava/intervals.icu/radio-directory quota or server CPU.
# RL_IP: every request, by caller IP, before sign-in is checked — so a flood of bad tokens is limited too. Twice the
# per-rider limit, so two riders behind one home router are never refused.
# namespace_id must be unique in the Cloudflare account (a shared id would share counters).
[[ratelimits]]
name = "RL_API"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 600
  period = 60

[[ratelimits]]
name = "RL_COSTLY"
namespace_id = "1002"
  [ratelimits.simple]
  limit = 30
  period = 60

[[ratelimits]]
name = "RL_PUBLIC"
namespace_id = "1003"
  [ratelimits.simple]
  limit = 60
  period = 60

[[ratelimits]]
name = "RL_IP"
namespace_id = "1004"
  [ratelimits.simple]
  limit = 1200
  period = 60

[triggers]
crons = ["* * * * *"]                       # Strava upload queue, every minute

# Neon Postgres through Hyperdrive (connection pooling + TLS to the database). Not a secret: the id is useless
# outside this Cloudflare account. Query caching is OFF (`wrangler hyperdrive update <id> --caching-disabled=true`):
# with it on, a read right after a write returned the old row (60 s), so a new rider's profile looked missing and was
# created twice (500), and renames seemed not to save.
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "3011ef3b3bcb4e2894f328dbedd2b6e7"
localConnectionString = "postgres://postgres:postgres@localhost:5432/myfitbike"  # wrangler needs a password; local Postgres usually ignores it. Override with CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE

# Enable once R2 is switched on in the account (until then finished rides are archived in Postgres):
# [[r2_buckets]]
# binding = "RIDES"
# bucket_name = "myfitbike-rides"

# Keep Worker logs, so refused requests (sign-in failures, rate limits, quotas) can be traced to an account (security
# audit 2, V19). Retention depends on the plan (3 days Free, 7 days Paid at the time of writing).
[observability]
enabled = true
